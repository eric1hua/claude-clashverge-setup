name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked Python dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Shell syntax
        run: |
          bash -n install.sh
          zsh -n scripts/reload-app.zsh
      - name: Routing tests
        run: node --test tests/claude-routing.test.cjs
      - name: Installer and deployment tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publication checks
        run: |
          python scripts/check-publication.py
          git diff --check
